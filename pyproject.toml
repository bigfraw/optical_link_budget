[project]
name = "optical-link-budget"
version = "0.1.0"
description = "Optical (laser) ground-to-space link budgets with atmospheric propagation, fade statistics and Monte Carlo."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "skyfield",
    "matplotlib",
]

[project.optional-dependencies]
# FAST (fast-aosim) supplies HV57 Cn2 profiles (olb.turbulence) and the
# fidelity-1 single-mode-fibre modal coupling (olb.models.coupling_fast).
turbulence = ["fast-aosim"]
# aotools (LGPL-3.0) draws the random phase screens of the fidelity-2
# split-step layer (olb.waveoptics.turbulence). olb imports it. olb does
# not copy it.
screens = ["aotools"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olb*"]

[tool.pyright]
# olb/_deps.py adds my_analysis_modules to sys.path at RUNTIME, so Pylance
# (static) cannot see `fields`, `conversions`, `satellite`, `coupled_flux`,
# `general_atmospherics`. Point it at that repo so those imports resolve.
# The path is relative to this file. If my_analysis_modules lives elsewhere
# (e.g. the MY_ANALYSIS_MODULES env var), change this path to match.
extraPaths = ["../my_analysis_modules"]
