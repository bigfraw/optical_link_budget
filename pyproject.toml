[project]
name = "optical-link-budget"
version = "0.1.0"
description = "Optical (laser) ground-to-space link budgets with atmospheric propagation, fade statistics and Monte Carlo."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy",
    "pandas",
    "skyfield",
    "matplotlib",
]

[project.optional-dependencies]
# FAST (fast-aosim) supplies HV57 Cn2 profiles (olb.turbulence) and the
# fidelity-1 single-mode-fibre modal coupling (olb.models.coupling_fast).
turbulence = ["fast-aosim"]
# aotools (LGPL-3.0) draws the random phase screens of the fidelity-2
# split-step layer (olb.waveoptics.turbulence). olb imports it. olb does
# not copy it.
screens = ["aotools"]
# cupy plus the nvidia CUDA wheels give the OPT-IN fidelity-2 FFT backend
# `fft_backend="cupy"` (olb.waveoptics.propagators). cupy 14 does not bundle
# the CUDA libraries, so the wheels are necessary; no CUDA toolkit is needed.
# The default of record stays "numpy", and a machine with no device does not
# need this extra.
gpu = [
    "cupy-cuda12x",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cublas-cu12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olb*"]
